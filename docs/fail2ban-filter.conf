# fail2ban filter for Login Support by thisismyurl.com
#
# Log format (one line per failed login):
#   YYYY-MM-DD HH:MM:SS ip username
#
# Example:
#   2026-05-06 14:22:11 203.0.113.42 admin
#
# Requirements:
#   - Enable "fail2ban File Log" in Settings > Login Support.
#   - Set the log file path to an absolute path OUTSIDE the web root.
#     Example: /var/log/wp-login-support.log
#   - The web server process must have write permission to that path.
#
# Installation:
#   1. Copy this file to /etc/fail2ban/filter.d/wp-login-support.conf
#   2. Add a jail to /etc/fail2ban/jail.local (see example below).
#   3. sudo systemctl reload fail2ban
#
# Example jail.local entry:
# ─────────────────────────────────────────────────────────────────────
# [wp-login-support]
# enabled  = true
# port     = http,https
# filter   = wp-login-support
# logpath  = /var/log/wp-login-support.log
# maxretry = 3
# findtime = 600
# bantime  = 3600
# ─────────────────────────────────────────────────────────────────────
#
# Adjust maxretry, findtime, and bantime to match your security policy.
# Note: Login Support also applies its own in-WordPress lockout — fail2ban
# provides a complementary OS/firewall-level block for traffic that never
# reaches PHP.

[Definition]
failregex = ^\S+ \S+ <HOST> \S+$
ignoreregex =
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
